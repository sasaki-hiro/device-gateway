name: build

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Update lockfile
        run: uv lock
        
      - name: Build image
        run: |
          docker build -f Dockerfile.dev -t qpu-server .

      - name: Save image
        run: |
          docker save qpu-server | gzip > device_gateway.tar.gz
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: device_gateway
          path: device_gateway.tar.gz
