proto:
  max_workers: 2
  address: "[::]:51021"

#device_id: "anemone"
device_info:
  device_id: "qiskit_sim"
  provider_id: "qiqb"
  max_qubits: 7
  max_shots: 10000

# Plugin configuration
plugin:
  name: "qiskit" # Available options: "qulacs", "qubex", "qiskit"
  backend:
    module_path: "device_gateway.plugins.qiskit_aer.backend"
    class_name: "AerBackend"

# Qubex plugin configuration. Uncomment to use Qubex backend
# plugin:
#   name: "qubex" # Available options: "qulacs", "qubex"
#   backend:
#     module_path: "device_gateway.plugins.qubex.backend"
#     class_name: "QubexBackend"

# Common backend settings
device_status_path: config/device_status
device_topology_json_path: config/device_topology_sim.json
